name: CI

on:
  push:
    branches: [develop, master, 'feature/**']
  pull_request:
    branches: [develop, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sigeb_test
          POSTGRES_USER: sigeb
          POSTGRES_PASSWORD: sigeb123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate Prisma Client
        run: cd apps/api && npx prisma generate

      - name: Run Prisma Migrations
        run: cd apps/api && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://sigeb:sigeb123@localhost:5432/sigeb_test

      - name: Run Tests
        run: npm run test
        env:
          DATABASE_URL: postgresql://sigeb:sigeb123@localhost:5432/sigeb_test
          JWT_SECRET: test-secret-key

      - name: Build
        run: npm run build
      - name: Smoke CI (S5)
        env:
          DATABASE_URL: postgresql://sigeb:sigeb123@localhost:5432/sigeb_test
          JWT_SECRET: test-secret-key
          JWT_REFRESH_SECRET: test-refresh-secret-key
        run: |
          cd apps/api
          npx prisma db seed
          node dist/main.js > /tmp/api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" || true' EXIT
          cd ../..
          set +e
          bash -x .github/scripts/smoke-ci.sh > /tmp/smoke-trace.log 2>&1
          SMOKE_CODE=$?
          set -e
          if [ "$SMOKE_CODE" -ne 0 ]; then
            echo "===== smoke-trace.log ====="
            tail -n 200 /tmp/smoke-trace.log || true
            echo "===== api.log ====="
            tail -n 150 /tmp/api.log || true
            exit "$SMOKE_CODE"
          fi
          tail -n 5 /tmp/smoke-trace.log



  deploy-staging:
    needs: lint-and-test
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to staging
        run: echo "Deploy to staging server"
        # Add deployment commands here

  deploy-production:
    needs: lint-and-test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production
        run: echo "Deploy to production server"
        # Add deployment commands here
