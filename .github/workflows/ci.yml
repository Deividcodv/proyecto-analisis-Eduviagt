name: CI

# Se ejecuta en cada push (cualquier rama) y en cada pull request.
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Versión de Node del repo: `engines.node >= 20` y las imágenes Docker usan
# `node:20`. Usamos Node 20 LTS con caché de npm (monorepo npm workspaces).
env:
  NODE_VERSION: '20'
  # Base de pruebas efímera levantada por el servicio `postgres` de cada job.
  DATABASE_URL: postgresql://sigeb:sigeb123@localhost:5432/sigeb_test
  E2E_DATABASE_URL: postgresql://sigeb:sigeb123@localhost:5432/sigeb_test
  JWT_SECRET: test-secret-key
  JWT_REFRESH_SECRET: test-refresh-secret-key

jobs:
  # ---------------------------------------------------------------------------
  # API: esquema + seed, lint, pruebas unitarias, chequeo de tipos (API y web)
  # y humo de integración con base efímera.
  # ---------------------------------------------------------------------------
  api-tests:
    name: API — lint, unit, tipos y humo
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sigeb_test
          POSTGRES_USER: sigeb
          POSTGRES_PASSWORD: sigeb123
        ports:
          - 5432:5432
        # Espera a que la base esté lista antes de correr los pasos.
        options: >-
          --health-cmd "pg_isready -U sigeb -d sigeb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # npm ci descarga el Chromium de Puppeteer (constancia PDF / US-F7).
      - name: Cachear navegador de Puppeteer
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: cd apps/api && npx prisma generate

      - name: Aplicar el esquema (migraciones)
        run: cd apps/api && npx prisma migrate deploy

      - name: Sembrar la base de pruebas
        run: cd apps/api && npx prisma db seed

      - name: Lint
        run: npm run lint

      - name: Pruebas unitarias del API
        run: npm run test:api

      - name: Tipos del API (tsc --noEmit)
        run: cd apps/api && npx tsc --noEmit

      - name: Tipos de la web (tsc --noEmit)
        run: cd apps/web && npx tsc --noEmit

      - name: Construir el API (para el humo)
        run: npm run build:api

      - name: Instalar dependencias de Chromium (constancia PDF / US-F7)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libgbm1 libasound2t64 libxshmfence1

      - name: Humo de integración (Sprints 3-5 + S6/S7 + F7 constancia PDF)
        env:
          STORAGE_PATH: /tmp/sigeb-storage
        run: |
          cd apps/api
          npx prisma db seed
          node dist/main.js > /tmp/api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" || true' EXIT
          cd ../..
          set +e
          bash -x .github/scripts/smoke-ci.sh > /tmp/smoke-trace.log 2>&1
          SMOKE_CODE=$?
          set -e
          if [ "$SMOKE_CODE" -ne 0 ]; then
            echo "===== smoke-trace.log (ultimas 200 lineas) ====="
            tail -n 200 /tmp/smoke-trace.log || true
            echo "===== api.log (ultimas 150 lineas) ====="
            tail -n 150 /tmp/api.log || true
            exit "$SMOKE_CODE"
          fi
          tail -n 5 /tmp/smoke-trace.log

  # ---------------------------------------------------------------------------
  # E2E de Playwright con base efímera (hallazgo F-002 / sugerencia S-015).
  # El `globalSetup` de Playwright reinicia y siembra `sigeb_test` antes de la
  # suite, por lo que cada corrida parte de un estado determinista.
  # ---------------------------------------------------------------------------
  e2e-web:
    name: Web — Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sigeb_test
          POSTGRES_USER: sigeb
          POSTGRES_PASSWORD: sigeb123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sigeb -d sigeb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # npm ci descarga el Chromium de Puppeteer (constancia PDF / US-F7).
      - name: Cachear navegador de Puppeteer
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Caché de los navegadores de Playwright.
      - name: Cachear navegadores de Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: cd apps/api && npx prisma generate

      - name: Aplicar el esquema en la base de pruebas
        # Imprescindible: Playwright espera a que su `webServer` (la API)
        # responda antes de ejecutar el `globalSetup`. Si la base esta vacia,
        # la API nunca esta sana, el `globalSetup` que crea el esquema no
        # llega a correr y la suite expira. Con el esquema ya aplicado, la
        # API arranca sana y el `globalSetup` puede reiniciar y sembrar la
        # base de pruebas con normalidad.
        run: cd apps/api && npx prisma migrate deploy

      - name: Instalar Chromium de Playwright
        run: cd apps/web && npx playwright install --with-deps chromium

      # `npm run test:e2e` = `playwright test`. El globalSetup deja `sigeb_test`
      # limpia y sembrada y Playwright levanta la API y la web.
      - name: Ejecutar E2E
        run: cd apps/web && npm run test:e2e

      - name: Publicar reporte de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Construcción de imágenes Docker (se conserva del flujo original).
  # Solo en las ramas de despliegue para no gastar minutos en cada PR.
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker — build de imágenes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen del API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: sigeb/api:check

      - name: Construir imagen de la web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: sigeb/web:check

  # ---------------------------------------------------------------------------
  # Despliegues (se conservan del flujo original).
  # ---------------------------------------------------------------------------
  deploy-staging:
    needs: [api-tests, docker-build]
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Verificar secretos de deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          [ -n "${DEPLOY_HOST}" ] || { echo "Falta el secreto DEPLOY_HOST en el entorno ${{ github.environment }}"; exit 1; }
          [ -n "${DEPLOY_USER}" ] || { echo "Falta el secreto DEPLOY_USER en el entorno ${{ github.environment }}"; exit 1; }
          [ -n "${DEPLOY_KEY}" ] || { echo "Falta el secreto DEPLOY_KEY en el entorno ${{ github.environment }}"; exit 1; }
          [ -n "${DEPLOY_PATH}" ] || { echo "Falta el secreto DEPLOY_PATH en el entorno ${{ github.environment }}"; exit 1; }

      - name: Deploy to staging (PM2)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git stash || true
            git checkout develop
            git pull --ff-only origin develop
            npm ci
            # La configuracion de la API vive en apps/api/.env, que no se
            # versiona: es la unica fuente de verdad. De ahi se toma la URL de
            # la base para aplicar las migraciones.
            export DATABASE_URL="$(grep -m1 '^DATABASE_URL=' apps/api/.env | cut -d= -f2-)"
            cd apps/api
            npx prisma migrate deploy
            npx prisma generate
            cd ../..
            npm run build
            # startOrRestart arranca el proceso si todavia no existe (un
            # `pm2 restart` con `|| true` dejaba el servicio caido) y aplica
            # siempre el cwd y el entorno del archivo de configuracion.
            pm2 startOrRestart ${{ vars.PM2_CONFIG_PATH || '/home/davi/sigeb.pm2.config.cjs' }} --only sigeb-api,sigeb-web
            pm2 save

  deploy-production:
    needs: [api-tests, docker-build]
    # Deshabilitado a proposito: `master` esta varias sprints por detras de
    # `develop`, asi que un push a master desplegaria un codigo ancientisimo.
    # Se activa poniendo PRODUCTION_READY=true en el entorno `production`,
    # una vez que master y el servidor de produccion esten alineados.
    if: github.ref == 'refs/heads/master' && vars.PRODUCTION_READY == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Verificar secretos de deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          [ -n "${DEPLOY_HOST}" ] || { echo "Falta el secreto DEPLOY_HOST en el entorno ${{ github.environment }}"; exit 1; }
          [ -n "${DEPLOY_USER}" ] || { echo "Falta el secreto DEPLOY_USER en el entorno ${{ github.environment }}"; exit 1; }
          [ -n "${DEPLOY_KEY}" ] || { echo "Falta el secreto DEPLOY_KEY en el entorno ${{ github.environment }}"; exit 1; }
          [ -n "${DEPLOY_PATH}" ] || { echo "Falta el secreto DEPLOY_PATH en el entorno ${{ github.environment }}"; exit 1; }

      - name: Deploy to production (PM2)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git stash || true
            git checkout master
            git pull --ff-only origin master
            npm ci
            export DATABASE_URL="$(grep -m1 '^DATABASE_URL=' apps/api/.env | cut -d= -f2-)"
            cd apps/api
            npx prisma migrate deploy
            npx prisma generate
            cd ../..
            npm run build
            pm2 startOrRestart ${{ vars.PM2_CONFIG_PATH || '/home/davi/sigeb.pm2.config.cjs' }} --only sigeb-api,sigeb-web
            pm2 save
