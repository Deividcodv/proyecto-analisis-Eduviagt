<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>EDUVIAGT — Diagramas de Arquitectura</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0a0d12; color: #e6edf7;
    min-height: 100vh;
  }
  header {
    padding: 24px 32px; max-width: 1400px; margin: 0 auto;
    border-bottom: 1px solid #1f2937;
  }
  h1 { margin: 0 0 8px; font-size: 28px; }
  .sub { color: #8492a8; margin: 0; }
  .tabs {
    max-width: 1400px; margin: 20px auto 0; padding: 0 32px;
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .tab {
    padding: 8px 16px; border: 1px solid #1f2937; border-radius: 8px;
    background: #121821; color: #8492a8; cursor: pointer;
    font-size: 13px; transition: all .2s;
  }
  .tab:hover { color: #e6edf7; border-color: #2a3650; }
  .tab.active { background: #182030; color: #46f9b8; border-color: #46f9b8; }
  .content {
    max-width: 1400px; margin: 20px auto; padding: 0 32px 40px;
  }
  .diagram-container {
    background: #121821; border: 1px solid #1f2937; border-radius: 12px;
    padding: 24px; overflow: auto;
    min-height: 400px;
  }
  .diagram-container .mermaid { text-align: center; }
  .info {
    margin-top: 16px; padding: 16px; background: #182030;
    border: 1px solid #1f2937; border-radius: 8px;
    font-size: 14px; color: #8492a8; line-height: 1.6;
  }
  .info strong { color: #e6edf7; }
  .info code { background: #0a0d12; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
  @media (max-width: 768px) {
    .tabs { padding: 0 16px; }
    .content { padding: 0 16px 24px; }
  }
</style>
</head>
<body>
<header>
  <h1>EDUVIAGT — Diagramas de Arquitectura</h1>
  <p class="sub">Diagramas interactivos de la plataforma EDUVIAGT v1.1 (Sprint 8 completo)</p>
</header>

<div class="tabs" id="tabs"></div>
<div class="content">
  <div class="diagram-container" id="diagram"></div>
  <div class="info" id="info"></div>
</div>

<script>
mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose' });

const diagrams = {
  'arquitectura': {
    title: 'Arquitectura General',
    desc: 'Monolito modular por capas: Frontend (Next.js) + Backend (NestJS) + PostgreSQL. Los servicios transversales (Authz, Bitácora, Notificaciones, Storage, PDF, IA) se inyectan donde se necesitan.',
    code: `flowchart TB
    subgraph Web["Frontend — apps/web (Next.js)"]
        UI[Páginas públicas, panel postulante, panel administrativo]
        Eduvi[Asistente Eduvi (chat flotante + soporte)]
    end
    subgraph Api["Backend — apps/api (NestJS)"]
        MW[Guards: throttling → JWT → autorización]
        CTRL[Controladores REST — un router por dominio]
        SVC[Servicios de dominio — reglas de negocio]
        REPO[Repositorios — interfaz + Prisma]
        MW --> CTRL --> SVC --> REPO
        subgraph Transversales["Servicios transversales"]
            AUTHZ[AuthzService]
            BITACORA[BitacoraService]
            NOTIF[NotificacionesService]
            STORAGE[DocumentStorage Adapter]
            PDF[PdfRenderer Adapter]
            IA[AsistenteIAProxy]
        end
    end
    DB[(PostgreSQL — 31 entidades)]
    UI -->|fetch + Bearer token| MW
    Eduvi -->|POST /asistente/preguntar| MW
    REPO --> DB
    SVC --> Transversales`
  },
  'despliegue': {
    title: 'Despliegue (PM2 + nginx)',
    desc: 'VM Azure Ubuntu con PM2 (sigeb-api :3000, sigeb-web :3002) y nginx :3001 como proxy inverso. PostgreSQL local en :5432. Documentos en /storage/.',
    code: `flowchart LR
    subgraph Internet
        U[Usuario / Navegador]
    end
    subgraph VM["VM Azure (Ubuntu)"]
        NGINX[nginx :3001]
        WEB[Next.js :3002]
        API[NestJS :3000]
        PG[(PostgreSQL :5432)]
        STORAGE[/storage/ documentos/]
    end
    U --> NGINX
    NGINX --> WEB
    WEB -->|fetch /api| API
    API --> PG
    API --> STORAGE`
  },
  'solicitud': {
    title: 'Ciclo de vida de Solicitud',
    desc: 'Máquina de estados de solicitud. Incluye segunda aprobación (Sprint 8) para montos > Q10,000.',
    code: `stateDiagram-v2
    [*] --> BORRADOR
    BORRADOR --> ENVIADA: enviar
    ENVIADA --> EN_REVISION: iniciar_revision
    EN_REVISION --> CORRECCION: pedir_correccion
    CORRECCION --> ENVIADA: reenviar
    EN_REVISION --> EVALUADA: finalizar_revision
    EVALUADA --> APROBADA: decidir (monto ≤ Q10,000)
    EVALUADA --> PENDIENTE_SEGUNDA_APROBACION: decidir (monto > Q10,000)
    PENDIENTE_SEGUNDA_APROBACION --> APROBADA: aprobar segunda (otra persona)
    PENDIENTE_SEGUNDA_APROBACION --> RECHAZADA: rechazar
    PENDIENTE_SEGUNDA_APROBACION --> EN_REVISION: devolver a revisión
    EVALUADA --> RECHAZADA: decidir
    APROBADA --> [*]
    RECHAZADA --> [*]`
  },
  'convocatoria': {
    title: 'Ciclo de vida de Convocatoria',
    desc: 'Máquina de estados de convocatoria. Transiciones validadas por el sistema.',
    code: `stateDiagram-v2
    [*] --> BORRADOR
    BORRADOR --> ABIERTA: publicar
    ABIERTA --> CERRADA: cerrar
    CERRADA --> EN_EVALUACION: iniciar_evaluacion
    EN_EVALUACION --> RESUELTA: resolver
    RESUELTA --> ARCHIVADA: archivar`
  },
  'permisos': {
    title: 'Cadena de Permisos (Chain of Responsibility)',
    desc: 'Resolución de permisos: excepción de usuario → permiso de rol → denegado por defecto.',
    code: `flowchart TD
    A[Request entrante] --> B{Excepción de usuario?}
    B -->|PERMITIR| C[Permitido]
    B -->|DENEGAR| D[Denegado]
    B -->|No existe| E{Permiso de rol?}
    E -->|Existe| C
    E -->|No existe| D`
  },
  'montos': {
    title: 'Montos Flexibles (Sprint 8)',
    desc: 'Cálculo de monto otorgable por tramos de ingreso familiar.',
    code: `flowchart TD
    A[Convocatoria] --> B{usarReglasMonto?}
    B -->|No| C[montoBase de la convocatoria]
    B -->|Sí| D[Ingreso familiar del postulante]
    D --> E{Buscar regla por tramo}
    E -->|FIJO| F[montoFijo]
    E -->|PORCENTAJE| G[montoBase × porcentaje]
    E -->|COMPLETO| H[montoBase completo]
    F --> I[montoOtorgable]
    G --> I
    H --> I
    C --> I
    I --> J[Trazabilidad: origen, calculado por, fecha]`
  },
  'segunda-aprobacion': {
    title: 'Segunda Aprobación (Sprint 8)',
    desc: 'Flujo de segunda aprobación para solicitudes con monto > Q10,000.',
    code: `sequenceDiagram
    participant E as Evaluador/Comité
    participant API as API (Solicitudes)
    participant DB as PostgreSQL
    participant B as BitacoraService
    E->>API: POST /solicitudes/:id/transicion (aprobar)
    API->>DB: Verificar monto > Q10,000
    alt Monto ≤ Q10,000
        API->>DB: Estado → APROBADA
        API->>B: Registrar aprobación (nivel 1)
    else Monto > Q10,000
        API->>DB: Estado → PENDIENTE_SEGUNDA_APROBACION
        API->>B: Registrar aprobación (nivel 1)
    end
    Note over E: Otra persona debe firmar
    E->>API: POST /solicitudes/:id/transicion (aprobar_segunda)
    API->>API: assertSegundaAprobacion (otra persona)
    API->>DB: Estado → APROBADA
    API->>B: Registrar aprobación (nivel 2)`
  },
  'eliminacion': {
    title: 'Eliminación de Cuenta (Sprint 8)',
    desc: 'Flujo de eliminación de cuenta con anonimización.',
    code: `sequenceDiagram
    participant U as Usuario
    participant API as API (Auth)
    participant DB as PostgreSQL
    participant FS as Filesystem
    U->>API: POST /auth/eliminar-cuenta
    API->>API: Validar contraseña + confirmación
    API->>DB: Anonimizar datos personales
    API->>FS: Eliminar documentos y archivos
    API->>DB: Marcar eliminadoAt
    API->>DB: Conservar con seudónimo (solicitudes, evaluaciones, votos)
    API->>DB: Sanear auditoría (sin CUI ni correo)
    API-->>U: Cuenta eliminada`
  },
  'eduvi': {
    title: 'Asistente Eduvi — Flujo de Pregunta',
    desc: 'Flujo de pregunta al asistente Eduvi con control de acceso por rol.',
    code: `sequenceDiagram
    participant U as Usuario
    participant W as Frontend (Eduvi)
    participant P as AsistenteIAProxy
    participant KB as Base de Conocimiento
    participant LLM as Proveedor IA (opcional)
    U->>W: Escribe pregunta
    W->>P: POST /asistente/preguntar
    P->>P: Resolver sesión y rol
    P->>P: Armar contexto permitido
    P->>KB: Búsqueda tsvector
    KB-->>P: Resultados relevantes
    alt AI_API_KEY configurada
        P->>LLM: Enviar pregunta + contexto
        LLM-->>P: Respuesta generada
    else Sin AI_API_KEY
        P->>P: Fallback (respuesta desde KB)
    end
    P-->>W: Respuesta + fuentes
    W-->>U: Mostrar respuesta de Eduvi`
  },
  'bitacora': {
    title: 'Bitácora del Sistema (Sprint 8)',
    desc: 'Registro inmutable de acciones del sistema.',
    code: `flowchart LR
    A[Acción de negocio] --> B[BitacoraService.registrar]
    B --> C{Misma transacción}
    C --> D[BitacoraSistema]
    D --> E[actor: persona, rol, correo]
    D --> F[fechaHora, módulo, entidad]
    D --> G[accionClave + accionHumana]
    D --> H[resultado: EXITOSO/RECHAZADO/ERROR]
    D --> I[ip, userAgent, origen]
    D --> J[datosRelevantes JSON]`
  },
  'descarga': {
    title: 'Descarga Segura de Documentos (Sprint 8)',
    desc: 'Flujo de descarga segura de documentos (reemplaza /storage público).',
    code: `sequenceDiagram
    participant U as Usuario
    participant API as API (Documentos)
    participant DB as PostgreSQL
    participant FS as Filesystem
    U->>API: GET /solicitudes/:id/documentos/:docId/descargar
    API->>API: Verificar autenticación (JWT)
    API->>DB: Buscar solicitud y documento
    API->>API: ¿Es dueño o revisor?
    alt Autorizado
        API->>FS: Leer archivo
        API->>DB: Registrar descarga en bitácora
        API-->>U: Archivo (PDF/imagen)
    else No autorizado
        API-->>U: 403 Forbidden
    end`
  },
  'er': {
    title: 'Modelo de Datos (ER) — Entidades principales',
    desc: 'Diagrama de relaciones entre las entidades principales del sistema.',
    code: `erDiagram
    ROL ||--o{ USUARIO : tiene
    ROL ||--o{ ROL_PERMISO : agrupa
    PERMISO ||--o{ ROL_PERMISO : asignado
    USUARIO ||--o{ USUARIO_PERMISO : excepciones
    PERMISO ||--o{ USUARIO_PERMISO : referenciado
    USUARIO ||--o| CONFIGURACION_USUARIO : preferencias
    BECA ||--o{ CONVOCATORIA : convoca
    BECA ||--o{ CRITERIO_EVALUACION : define
    CONVOCATORIA ||--o{ CONVOCATORIA_DOC_REQUERIDO : exige
    CONVOCATORIA ||--o{ CONVOCATORIA_REGLA_MONTO : tiene
    CONVOCATORIA ||--o{ SOLICITUD : recibe
    USUARIO ||--o{ SOLICITUD : postula
    SOLICITUD ||--|| SOLICITUD_PERFIL_ACADEMICO : tiene
    SOLICITUD ||--|| SOLICITUD_PERFIL_FINANCIERO : tiene
    SOLICITUD ||--o{ SOLICITUD_DOCUMENTO : adjunta
    SOLICITUD ||--o{ HISTORIAL_ESTADO : registra
    SOLICITUD ||--o{ EVALUACION : recibe
    SOLICITUD ||--o{ SOLICITUD_APROBACION : firmas
    COMITE ||--o{ COMITE_MIEMBRO : integra
    USUARIO ||--o{ COMITE_MIEMBRO : participa
    COMITE ||--o{ SESION : sesiona
    SESION ||--o{ VOTO : registra
    SESION ||--o{ DECISION : emite
    USUARIO ||--o{ AUDIT_LOG : genera
    USUARIO ||--o{ NOTIFICACION : recibe`
  }
};

const tabsContainer = document.getElementById('tabs');
const diagramContainer = document.getElementById('diagram');
const infoContainer = document.getElementById('info');

let currentTab = 'arquitectura';

function renderTabs() {
  tabsContainer.innerHTML = '';
  Object.keys(diagrams).forEach((key, idx) => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (key === currentTab ? ' active' : '');
    btn.textContent = (idx + 1) + '. ' + diagrams[key].title;
    btn.onclick = () => switchTab(key);
    tabsContainer.appendChild(btn);
  });
}

function switchTab(key) {
  currentTab = key;
  renderTabs();
  renderDiagram();
}

async function renderDiagram() {
  const d = diagrams[currentTab];
  diagramContainer.innerHTML = '<div class="mermaid">' + d.code + '</div>';
  infoContainer.innerHTML = '<strong>' + d.title + '</strong><br>' + d.desc;
  try {
    await mermaid.run({ querySelector: '.mermaid' });
  } catch (e) {
    diagramContainer.innerHTML = '<p style="color:#ff6b8a;">Error al renderizar: ' + e.message + '</p><pre style="color:#8492a8;font-size:12px;">' + d.code + '</pre>';
  }
}

renderTabs();
renderDiagram();
</script>
</body>
</html>
