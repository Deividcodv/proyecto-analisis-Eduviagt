# Portal EDUVIAGT — proxy inverso hacia la web de Next.js (standalone).
#
# La web corre en PM2 escuchando solo en 127.0.0.1:3002 y nginx es lo unico
# que queda expuesto. Por ahora nginx escucha en el 3001 porque es el unico
# puerto abierto en el NSG de Azure; cuando exista un dominio propio se
# anaden los listeners de 80 y 443 con el certificado de Let's Encrypt.
#
# Este archivo esta en el repositorio: `scripts/nginx/sigeb.conf`.
# En el servidor se copia a /etc/nginx/sites-available/sigeb.

# Solo se reenvia la cabecera Connection: upgrade cuando el cliente la pide;
# en el resto de casos se cierra la conexion del proxy.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Cabeceras de seguridad. Se anaden en todas las respuestas, incluidas las
# de error, para que una pagina inexistente tampoco las omita.
server {
    listen 3001;
    listen [::]:3001;
    server_name _;

    # No anuncia la version de nginx.
    server_tokens off;

    # Las cargas de documentos llegan al proxy antes de ir a la API, que
    # acepta hasta 5 MB. El limite por defecto de nginx (1 MB) las cortaria.
    client_max_body_size 10m;

    # Cabeceras de seguridad.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Content-Security-Policy. Next.js inserta scripts en linea, por lo que
    # hace falta 'unsafe-inline' mientras no se usen nonces por peticion.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; object-src 'none'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'" always;

    # Strict-Transport-Security solo tiene sentido con HTTPS: activarlo sin
    # certificado hace que el navegador no vuelva a intentar el sitio.
    # Descomentar cuando haya dominio y TLS.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/sigeb.access.log;
    error_log /var/log/nginx/sigeb.error.log;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Soporte para conexiones persistentes (SSE del asistente).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Sin buffer: el asistente responde por SSE y con buffer la respuesta
        # llegaria a saltos en vez de en streaming.
        proxy_buffering off;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Comprobacion de salud sin pasar por la aplicacion.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
